<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8e73f7"/>
      <stop offset="100%" stop-color="#5e42ca"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="8" stroke="white" stroke-width="2.2" fill="none"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="3" fill="white"/>
  <!-- Small tick / signal line top-right -->
  <line x1="21.5" y1="10.5" x2="24" y2="8" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
</svg>
