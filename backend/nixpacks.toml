providers = ["node"]

[phases.setup]
nixPkgs = ["postgresql_16"]

[phases.install]
# NODE_ENV=production would skip devDependencies (including @nestjs/cli); force include them
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build",
  "npx tsc prisma/seed.ts --outDir dist/prisma --esModuleInterop --resolveJsonModule --module commonjs --target es2020 --skipLibCheck"
]

[start]
cmd = "npx prisma migrate deploy && node dist/prisma/seed.js && node dist/src/main"
