services:
  - type: web
    name: agentwatch-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build && npx tsc prisma/seed.ts --outDir dist/seed --esModuleInterop --resolveJsonModule --module commonjs --target es2020 --skipLibCheck || true
    startCommand: npx prisma migrate deploy && node dist/seed/seed.js && node dist/src/main
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: AI_SIMULATION
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: agentwatch-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false   # fill in after Vercel deploy

databases:
  - name: agentwatch-db
    databaseName: agentwatch
    plan: free
